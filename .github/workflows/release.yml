name: Release

# Publishes to npm when a v* tag is pushed.
#
# Auth: npm trusted publishing (OIDC). No token is stored anywhere - npm verifies this
# workflow's identity directly. Configured on the package under Settings > Trusted
# Publisher, and it must keep matching this workflow exactly:
#   owner/repo = siktec-lab/product-mapper-ts, workflow = release.yml, environment = npm
# Renaming this file, or changing the environment below, breaks publishing until the
# trusted publisher is updated to match.
#
# The publish is signed with provenance, so npm shows a verified link back to this
# workflow run and commit.
on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            dry_run:
                description: Run every step but do not actually publish
                required: true
                default: true
                type: boolean

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            - name: Smoke test the built package on Node 18
              uses: actions/setup-node@v4
              with:
                  node-version: 18.x
            - run: node scripts/node18-smoke.mjs

            - name: Verify the tag matches the package version
              # A tag that disagrees with package.json would publish a version nobody
              # can trace back to a commit, so fail loudly before anything is uploaded.
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  echo "tag=$TAG package=$PKG"
                  if [ "$TAG" != "$PKG" ]; then
                      echo "::error::Tag v$TAG does not match package version $PKG"
                      exit 1
                  fi

    publish:
        needs: verify
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            # Required for both npm trusted publishing and provenance attestation.
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Use an npm that supports trusted publishing
              # OIDC publishing needs npm 11.5.1 or newer, which is ahead of the npm
              # bundled with the Node versions this action installs.
              run: npm install -g npm@latest

            - run: npm ci
            - run: npm run build

            - name: Publish (dry run)
              # There is no way to "log in" with OIDC: npm mints a short-lived credential
              # inside `npm publish` itself, so `npm whoami` only sees the placeholder
              # NODE_AUTH_TOKEN that setup-node writes into .npmrc and returns 401.
              #
              # Publishing the current version is therefore the only real auth probe. The
              # version is already published, so npm answers with the version conflict
              # (E409/EPUBLISHCONFLICT), which it can only do after authenticating the
              # request. That specific error is the pass condition; a 401 or ENEEDAUTH is
              # a genuine trusted-publisher failure.
              if: github.event_name == 'workflow_dispatch' && inputs.dry_run
              run: |
                  set +e
                  out=$(npm publish --access public --provenance --dry-run 2>&1)
                  code=$?
                  set -e
                  echo "$out"
                  if [ $code -eq 0 ]; then
                      echo "::notice::Dry run published cleanly: this version is not on the registry yet."
                      exit 0
                  fi
                  if echo "$out" | grep -qiE "cannot publish over|EPUBLISHCONFLICT|409"; then
                      echo "::notice::Registry authenticated the request and rejected only the duplicate version. Trusted publishing (OIDC) is working."
                      exit 0
                  fi
                  if echo "$out" | grep -qiE "ENEEDAUTH|E401|401 Unauthorized|EOTP"; then
                      echo "::error::Authentication failed. Check the trusted publisher on npm matches owner=siktec-lab, repo=product-mapper-ts, workflow=release.yml, environment=npm."
                      exit 1
                  fi
                  echo "::error::Dry run failed for an unexpected reason (see output above)."
                  exit 1

            - name: Publish
              if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
              run: npm publish --access public --provenance
