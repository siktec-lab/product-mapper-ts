name: Release

# Publishes to npm when a v* tag is pushed.
#
# Auth: npm trusted publishing (OIDC). No token is stored anywhere - npm verifies this
# workflow's identity directly. Configured on the package under Settings > Trusted
# Publisher, and it must keep matching this workflow exactly:
#   owner/repo = siktec-lab/product-mapper-ts, workflow = release.yml, environment = npm
# Renaming this file, or changing the environment below, breaks publishing until the
# trusted publisher is updated to match.
#
# The publish is signed with provenance, so npm shows a verified link back to this
# workflow run and commit.
on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            dry_run:
                description: Run every step but do not actually publish
                required: true
                default: true
                type: boolean

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

            - name: Smoke test the built package on Node 18
              uses: actions/setup-node@v4
              with:
                  node-version: 18.x
            - run: node scripts/node18-smoke.mjs

            - name: Verify the tag matches the package version
              # A tag that disagrees with package.json would publish a version nobody
              # can trace back to a commit, so fail loudly before anything is uploaded.
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  echo "tag=$TAG package=$PKG"
                  if [ "$TAG" != "$PKG" ]; then
                      echo "::error::Tag v$TAG does not match package version $PKG"
                      exit 1
                  fi

    publish:
        needs: verify
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            # Required for both npm trusted publishing and provenance attestation.
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Use an npm that supports trusted publishing
              # OIDC publishing needs npm 11.5.1 or newer, which is ahead of the npm
              # bundled with the Node versions this action installs.
              run: npm install -g npm@latest

            - run: npm ci
            - run: npm run build

            - name: Publish (dry run)
              # `npm publish --dry-run` still calls the registry and fails on a version
              # that is already published, so it can never pass once a release is out.
              # `npm whoami` proves the same thing that matters here - that OIDC produced
              # a working credential - without touching an existing version.
              if: github.event_name == 'workflow_dispatch' && inputs.dry_run
              run: |
                  echo "Verifying registry authentication..."
                  npm whoami
                  echo "Auth OK. Packing the tarball that a real release would upload:"
                  npm pack --dry-run

            - name: Publish
              if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
              run: npm publish --access public --provenance
