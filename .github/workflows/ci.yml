name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Vitest 5 requires Node 20 or newer, so the suite runs there. The
                # published package still supports Node 18, which the compat job below
                # verifies against the real build output.
                node-version: [20.x, 22.x, 24.x]
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build

    node18-compat:
        # Guards the "node >= 18" engines claim: the built ESM and CJS bundles must load
        # and work on the oldest supported runtime, even though the dev tooling cannot.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build on a supported Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - run: npm ci
            - run: npm run build

            - name: Switch to Node 18
              uses: actions/setup-node@v4
              with:
                  node-version: 18.x

            - name: Smoke test the built package on Node 18
              run: node scripts/node18-smoke.mjs
